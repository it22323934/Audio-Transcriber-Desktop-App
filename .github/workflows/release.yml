# Builds the Windows installer and publishes it as a GitHub release.
# Runs when a version tag is pushed (npm version patch && git push --follow-tags),
# or by hand from the Actions tab for an existing tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release, e.g. v0.1.0'
        required: true

permissions:
  contents: write # create the release and upload the installer

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # runs the TypeScript unit tests directly
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the version matches the tag
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "package.json says $version but the tag is $TAG. Bump the version with npm version." >&2
            exit 1
          fi

      - name: Type checks and unit tests
        run: |
          npm run typecheck
          npm run test:unit

      - name: Build the installer
        run: npm run dist -- --publish never

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: TORU ${{ env.TAG }}
          body_path: .github/RELEASE_NOTES.md
          generate_release_notes: true
          files: release/TORU-Setup-*.exe
